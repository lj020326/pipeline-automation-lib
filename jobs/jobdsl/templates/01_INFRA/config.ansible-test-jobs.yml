---
jobFolder: "INFRA/repo-automation"
jobList:
  - jobName: "run-ansible-test"
    jobType: "pipeline"
    scmSourceType: "cps"
    jobScript: "runAnsibleTestPipeline()"
    description: "Ansible-Test Pipeline"
    numToKeep: 200
    daysToKeep: -1
    addInitializeParamsOnly: true
    copyArtifactProjects: "/**"
    throttleCategories:
      - "ansible_test"
    parameters:
      - name: "AnsibleTestCommand"
        type: "choice"
        choices:
          - "sanity"
          - "units"
          - "integration"
        description: "Choose ansible-test type"
      - name: "CollectionNamespace"
        type: "string"
        defaultValue: "dettonville"
        description: "Specify the Ansible collection namespace (e.g., 'dettonville')"
      - name: "CollectionName"
        type: "string"
        defaultValue: "utils"
        description: "Specify the Ansible collection name (e.g., 'utils')"
      - name: "GitRepoUrl"
        type: "string"
        defaultValue: "ssh://git@gitea.admin.dettonville.int:2222/infra/ansible-dettonville-utils.git"
        description: "Specify the git repo image URL"
      - name: "GitRepoBranch"
        type: "string"
        defaultValue: "main"
        description: "Specify the git repo branch"
      - name: "GitCredentialsId"
        type: "string"
        defaultValue: "jenkins-ansible-ssh"
        description: "Specify the git repo credential ID"
      - name: "RunnerImageName"
        type: "string"
        defaultValue: "ansible/ansible-test"
        description: ""
      - name: "RunnerRegistry"
        type: "string"
        defaultValue: "media.johnson.int:5000"
        description: ""
      - name: "RegistryCredentialsId"
        type: "string"
        defaultValue: "docker-registry-admin"
        description: "Specify the Registry Credential Id"
      - name: "AnsibleVersion"
        type: "string"
        defaultValue: "2.19"
        description: ""
      - name: "PythonVersion"
        type: "string"
        defaultValue: "3.13"
        description: ""
      - name: "TestDeps"
        type: "string"
        defaultValue: ""
        description: ""
      - name: "PreTestCmd"
        type: "string"
        defaultValue: ""
        description: ""
      - name: "TestResultsDir"
        type: "string"
        defaultValue: ".test-results"
        description: ""
      - name: "JunitTestResultsDir"
        type: "string"
        defaultValue: "tests/output/junit"
        description: ""
      - name: "AnsibleDebugFlag"
        type: "choice"
        choices:
          - ""
          - "-v"
          - "-vv"
          - "-vvv"
          - "-vvvv"
        description: "Choose Ansible Debug Level"
      - name: "ChangedEmailList"
        type: "string"
        defaultValue: ""
        description: "Specify the email recipients for job 'changed' status"
      - name: "AlwaysEmailList"
        type: "string"
        defaultValue: ""
        description: "Specify the email recipients for job 'always' status"
      - name: "FailedEmailList"
        type: "string"
        defaultValue: ""
        description: "Specify the email recipients for job 'failed' status"
      - name: "Timeout"
        type: "string"
        defaultValue: "4"
        description: "Specify the job timeout"
      - name: "TimeoutUnit"
        type: "string"
        defaultValue: "HOURS"
        description: "Specify the job timeout unit (HOURS, MINUTES, etc)"
      - name: "LogLevel"
        type: "choice"
        choices:
          - "DEBUG"
          - "INFO"
          - "WARN"
          - "ERROR"
        description: "Choose log level"
