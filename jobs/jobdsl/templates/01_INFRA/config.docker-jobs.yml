---
jobFolder: "INFRA/repo-automation"
jobList:
  - jobName: "build-docker-image"
    jobType: "pipeline"
    scmSourceType: "cps"
    jobScript: "buildDockerImagePipeline()"
    description: "Build Docker Image Pipeline"
    numToKeep: 200
    daysToKeep: -1
    addInitializeParamsOnly: true
    copyArtifactProjects: "/**"
    throttleCategories:
      - "docker_image_builds"
    parameters:
      - name: "GitRepoUrl"
        type: "string"
        defaultValue: "ssh://git@gitea.admin.dettonville.int:2222/infra/docker-jenkins.git"
        description: "Specify the git repo image URL"
      - name: "GitRepoBranch"
        type: "string"
        defaultValue: "main"
        description: "Specify the git repo branch"
      - name: "GitCredentialsId"
        type: "string"
        defaultValue: "gitea-ssh-jenkins"
        description: "Specify the git repo credential ID"
      - name: "RegistryUrl"
        type: "string"
        defaultValue: "https://media.johnson.int:5000"
        description: "Specify the RegistryUrl"
      - name: "RegistryCredId"
        type: "string"
        defaultValue: "docker-registry-admin"
        description: "Specify the RegistryCredId"
      - name: "BuilderImage"
        type: "string"
        defaultValue: ""
        description: "Specify the docker builder image (e.g., 'media.johnson.int:5000/ansible/ansible-runner:stable-2.18-py3.13')"
      - name: "BuilderUid"
        type: "string"
        defaultValue: ""
        description: "Specify the build runner UID (e.g., 'jenkins')"
      - name: "BuilderGid"
        type: "string"
        defaultValue: ""
        description: "Specify the build runner GID (e.g., 'jenkins')"
      - name: "BuildImageName"
        type: "string"
        defaultValue: ""
        description: "Specify the BuildImageName (e.g., 'docker-jenkins')"
      - name: "BuildDir"
        type: "string"
        defaultValue: "."
        description: "Specify relative directory where docker build will run (e.g., 'image/base')"
      - name: "BuildPath"
        type: "string"
        defaultValue: "."
        description: "Specify relative directory used as final argument to docker"
      - name: "BuildTags"
        type: "string"
        defaultValue: ""
        description: "Specify the docker image tags in comma delimited format (e.g., 'build-123,latest')"
      - name: "BuildPlatforms"
        type: "string"
        defaultValue: "linux/amd64"
        description: "Target architectures comma-separated (e.g., linux/amd64,linux/arm64)"
      - name: "BuildArgs"
        type: "string"
        defaultValue: ""
        description: "Specify the BuildArgs in JSON string format"
      - name: "BuildTestCommand"
        type: "string"
        defaultValue: ""
        description: "The shell command to run post-build, pre-push"
      - name: "BuildTestAppendIdArg"
        type: "boolean"
        defaultValue: false
        description: "If true - append env.BUILD_NUMBER to test command"
      - name: "BuildTestAppendIdOption"
        type: "string"
        defaultValue: ""
        description: "Append option name to shell command followed by env.BUILD_NUMBER"
      - name: "RunTestCommandInsideContainer"
        type: "boolean"
        defaultValue: false
        description: "If true - run buildTestCommand inside target container"
      - name: "TestResultsPath"
        type: "string"
        defaultValue: ""
        description: "Path to test result files to archive"
      - name: "DockerFile"
        type: "string"
        defaultValue: ""
        description: "Specify the docker file"
      - name: "ChangedEmailList"
        type: "string"
        defaultValue: ""
        description: "Email recipients for job 'changed' status"
      - name: "AlwaysEmailList"
        type: "string"
        defaultValue: ""
        description: "Email recipients for job 'always' status"
      - name: "FailedEmailList"
        type: "string"
        defaultValue: ""
        description: "Email recipients for job 'failed' status"
      - name: "Timeout"
        type: "string"
        defaultValue: "4"
        description: "Specify the job timeout"
      - name: "TimeoutUnit"
        type: "string"
        defaultValue: "HOURS"
        description: "Specify the job timeout unit (HOURS, MINUTES, etc)"
